# oinit CA configuration for docker/compose-oinit.yaml.
#
# The CA validates OIDC tokens against the motley_cue appliance over the
# compose network and signs short-lived SSH certificates for it.
#
# The hostname keys below are the names clients use when asking the CA for a
# certificate (GET/POST /oinit/api/v1/<host>/...):
#   - "motley-cue" is SSH_INTERNAL_HOSTNAME of the webssh container (dialed
#     server-side)
#   - "localhost"  is SSH_HOSTNAME from ../.env (used by the browser session
#     and by the CLI: ssh localhost -p 1022)
#
# The section name is only a human-readable hostgroup label.

listen-address = 0.0.0.0:8082

host-ca-privkey = /etc/oinit/host-ca
host-ca-pubkey  = /etc/oinit/host-ca.pub
user-ca-privkey = /etc/oinit/user-ca
user-ca-pubkey  = /etc/oinit/user-ca.pub

cert-validity = 21600
cert-validity-fallback = 1800

[webssh]
motley-cue = http://motley-cue:8080
localhost = http://motley-cue:8080
