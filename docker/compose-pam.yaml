# Full stack (PAM variant): Caddy + motley_cue all-in-one (PAM login) + webssh-oidc.
#
# The motley_cue service is the official all-in-one appliance image
# (sshoidc/motley-cue-allinone:<version>-pam): motley_cue API + local_unix
# account provisioning + sshd with pam_ssh_oidc token login.
#
# Run everything (webssh-oidc in a container):
#   docker compose -f docker/compose-pam.yaml pull
#   docker compose -f docker/compose-pam.yaml up -d
#
# The app image is published by CI. Use WEBSSH_TAG=prerel for the
# prerelease image, or a version such as WEBSSH_TAG=0.2.4 for a release.
# MC_TAG selects the motley_cue image version.
#
# Run only the infrastructure and develop webssh-oidc on the host:
#   docker compose -f docker/compose-pam.yaml -f docker/compose.dev.yaml up -d caddy motley-cue
#   npm run dev      # SvelteKit + SSH bridge on :8444
#
# The oinit variant of the stack is docker/compose-oinit.yaml (Caddy +
# motley_cue all-in-one with oinit login + oinit CA + webssh-oidc).
#
# See docker/README.md for details.

name: webssh-oidc-pam

services:
  motley-cue:
    image: sshoidc/motley-cue-allinone:${MC_TAG:-0.8.9}-pam
    hostname: motley-cue
    restart: unless-stopped
    ports:
      # Published for direct SSH access/testing from the host.
      - '1022:22'
    environment:
      MOTLEY_CUE_VARIANT: pam
      MOTLEY_CUE_CONFIG: /etc/motley_cue/motley_cue.conf
      FEUDAL_ADAPTER_CONFIG: /etc/motley_cue/feudal_adapter.conf
      # caddy (and the oinit CA in the oinit variant) reach the API over the
      # compose network.
      BIND: 0.0.0.0:8080
    volumes:
      - ./motley-cue-config/motley_cue.conf:/etc/motley_cue/motley_cue.conf:ro
      - ./motley-cue-config/feudal_adapter.conf:/etc/motley_cue/feudal_adapter.conf:ro
      # accounts, homes, SSH host keys, OTP token database
      - motley_cue_state:/state
    healthcheck:
      # The appliance image has no netcat; use its Python to probe the API.
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/", timeout=3)'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    hostname: caddy
    restart: unless-stopped
    extra_hosts:
      # Lets Caddy reach webssh-oidc on the host in dev mode
      # (npm run dev on :8444) and lets its healthcheck resolve the site.
      - 'host.docker.internal:host-gateway'
      - 'motley-cue.localhost:127.0.0.1'
      - 'webssh-oidc.localhost:127.0.0.1'
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Containerized webssh-oidc; docker/compose.dev.yaml overrides this
      # with host.docker.internal:8444 for the npm run dev workflow.
      WEBSSH_UPSTREAM: webssh:8444
      # Override for a remote VM (see docker/README.md). Values are read
      # from docker/.env / the shell, not from the repo-root .env.
      WEBSSH_HOST: ${WEBSSH_HOST:-webssh-oidc.localhost}
      MC_HOST: ${MC_HOST:-motley-cue.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      motley-cue:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  webssh:
    image: sshoidc/webssh-oidc:${WEBSSH_TAG:-latest}
    hostname: webssh
    restart: unless-stopped
    ports:
      - '8444:8444'
    # Single source of truth for both run modes. The values below are the
    # container-internal ones and override ../.env (which is written for
    # running the app on the host).
    env_file:
      - ../.env
    environment:
      INTERNAL_MC_ENDPOINT: http://caddy/motley_cue/
      SSH_INTERNAL_HOSTNAME: motley-cue
      SSH_PORT: '22'
    volumes:
      - ../config:/app/config
      - ../config/docs:/app/build/client/docs
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '8444']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 2s

volumes:
  motley_cue_state:
  caddy_data:
  caddy_config:
