<!doctype html>
<html lang="en" class="h-full bg-gray-50 dark:bg-gray-900 dark:text-gray-200">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width" />

		<script>
			(function() {
				var stored = localStorage.getItem('darkMode');
				var dark = stored !== null ? JSON.parse(stored) : window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (dark) document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="h-full bg-gray-50 dark:bg-gray-900">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
