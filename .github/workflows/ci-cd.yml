name: CI-CD

on:
  push:
    branches:
      - 'main'
      - 'prerel'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'main'
      - 'prerel'

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: sshoidc/webssh-oidc

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          corepack enable
          npm ci
      - name: Build
        run: npm run build
      # - name: Test
      #   run: npm run test
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/prerel' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Get Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_LOG_LEVEL=info
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') &&
      !contains(github.ref_name, '~')
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy webssh-oidc
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WEBSSH_HOST: ${{ vars.WEBSSH_HOST || 'webssh.ssh-oidc-cicd.vm.fedcloud.eu' }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "VERSION='$VERSION' flock -w 600 /tmp/webssh-oidc-deploy.lock sh -s" <<'EOF'
          set -eu
          cd /opt/webssh-oidc
          git fetch --prune --tags origin
          for f in docker/compose-oinit.yaml docker/compose.prod.yaml; do
            git cat-file -e "v$VERSION:$f" || {
              echo "ERROR: v$VERSION does not contain $f; not a deployable manifest." >&2
              exit 1
            }
          done
          git -c advice.detachedHead=false checkout --force --detach "v$VERSION"
          git describe --exact-match --tags HEAD
          if grep -q '^WEBSSH_TAG=' docker/.env; then
            sed -i "s|^WEBSSH_TAG=.*|WEBSSH_TAG=$VERSION|" docker/.env
          else
            printf 'WEBSSH_TAG=%s\n' "$VERSION" >> docker/.env
          fi
          COMPOSE='docker compose -f docker/compose-oinit.yaml -f docker/compose.prod.yaml'
          $COMPOSE pull webssh
          $COMPOSE up -d --wait --no-deps webssh caddy
          $COMPOSE ps
          EOF
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -o /dev/null "https://$WEBSSH_HOST/"
      - name: Show remote logs on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/webssh-oidc && docker compose -f docker/compose-oinit.yaml -f docker/compose.prod.yaml logs --tail=100 webssh caddy" || true
